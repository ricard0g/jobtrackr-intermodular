<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./styles/reset.css" />
		<link rel="stylesheet" href="./styles/styles.css" />
		<title>JobTrackr</title>
		<script src="./scripts/script.js" defer></script>
	</head>
	<body>
		<header class="header__container">
			<!-- Desktop Navbar -->
			<nav class="header__navbar">
				<ul class="header__outer-list">
					<li class="logo">
						<img
							src="./assets/jobtrackr-logo.webp"
							class="logo-image"
						/>
						<span>JobTrackr</span>
					</li>
					<li class="header__inner-list-container">
						<ul class="header__inner-list">
							<li>
								<a href="#">Inicio</a>
							</li>
							<li>
								<a href="#">Funcionalidades</a>
							</li>
							<li>
								<a href="#">Proceso</a>
							</li>
							<li>
								<a href="#">Contacto</a>
							</li>
						</ul>
					</li>
					<li>
						<a class="header__cta" href="https://ricardoguzdev.com"
							>Ir a la App</a
						>
					</li>
				</ul>
			</nav>

			<!-- Mobile Navbar -->
			<nav class="header__navbar-mobile">
				<ul class="header__outer-list">
					<li class="logo">
						<img
							src="./assets/jobtrackr-logo.webp"
							class="logo-image"
						/>
						<span>JobTrackr</span>
					</li>
					<li class="header__button-mobile">
						<button id="mobile-button">
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="24"
								height="24"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
								class="lucide lucide-menu-icon lucide-menu"
							>
								<path d="M4 5h16" />
								<path d="M4 12h16" />
								<path d="M4 19h16" />
							</svg>
						</button>
						<ul class="header__inner-list-mobile">
							<li>
								<a href="#">Inicio</a>
							</li>
							<li>
								<a href="#">Funcionalidades</a>
							</li>
							<li>
								<a href="#">Proceso</a>
							</li>
							<li>
								<a href="#">Contacto</a>
							</li>
							<li>
								<a
									class="header__cta"
									href="https://ricardoguzdev.com"
									>Ir a la App</a
								>
							</li>
						</ul>
					</li>
				</ul>
			</nav>
		</header>
	</body>
</html>
